<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Read & Ridge 프로토타입</title>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(to bottom, #ff7e5f, #feb47b); height: 100vh; overflow: hidden; font-family: sans-serif; }
        .mountain-range { display: flex; align-items: flex-end; position: absolute; bottom: 100px; width: 100%; padding-left: 50px; gap: 40px; }
        .mountain { position: relative; width: 200px; height: 300px; background-color: #4a7c59; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); z-index: 10; transform: scale(1.1); filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3)); }
        .mountain.back { background-color: #285238; z-index: 1; transform: scale(0.8); opacity: 0.6; }
        .character { position: absolute; width: 30px; height: 30px; background-color: #ff4757; border-radius: 50%; left: 45%; bottom: 45%; transition: bottom 0.5s ease-in-out; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }
        .ui-panel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); padding: 15px 30px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="mountain-range">
        <div class="mountain back"></div>
        <div class="mountain"><div class="character" id="myCharacter"></div></div>
        <div class="mountain back"></div>
    </div>
    <div class="ui-panel">
        <label>🧗 현재 고도 입력 (%): </label>
        <input type="number" id="progressInput" value="45" min="0" max="100" oninput="moveClimber()">
    </div>
    <script>
        function moveClimber() {
            const percent = document.getElementById('progressInput').value;
            const climber = document.getElementById('myCharacter');
            climber.style.bottom = (percent * 0.9) + '%'; 
        }
    </script>
</body>
</html>
